<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Matte Background -->
    <linearGradient id="obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1e" />
      <stop offset="100%" stop-color="#0b0b0d" />
    </linearGradient>

    <!-- Warm Manga Paper Gradient -->
    <linearGradient id="paperLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f2eb" />
      <stop offset="85%" stop-color="#ebe6dc" />
      <stop offset="100%" stop-color="#c9c2b4" />
    </linearGradient>

    <linearGradient id="paperRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9c2b4" />
      <stop offset="15%" stop-color="#ebe6dc" />
      <stop offset="100%" stop-color="#f5f2eb" />
    </linearGradient>

    <!-- Hard Neo-Brutalist Offset Shadow -->
    <filter id="hardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="0" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#obsidian)" stroke="#2c2c32" stroke-width="4" />

  <!-- Subtle Background Grid (Technical Blueprint Feel) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="2">
    <line x1="256" y1="16" x2="256" y2="496" />
    <line x1="16" y1="256" x2="496" y2="256" />
  </g>

  <!-- Main Emblem Group -->
  <g filter="url(#hardShadow)">
    
    <!-- Back Stacked Landscape Frame (Represents Full Double-Page Spread) -->
    <rect x="84" y="136" width="344" height="248" rx="14" fill="#d93829" stroke="#08080a" stroke-width="14" />

    <!-- Left Portrait Page (Tilted inward toward spine) -->
    <path d="M 104 112 
             L 252 136 
             L 252 388 
             L 104 364 Z" 
          fill="url(#paperLeft)" 
          stroke="#08080a" 
          stroke-width="14" 
          stroke-linejoin="round" />

    <!-- Right Portrait Page (Tilted inward toward spine) -->
    <path d="M 408 112 
             L 260 136 
             L 260 388 
             L 408 364 Z" 
          fill="url(#paperRight)" 
          stroke="#08080a" 
          stroke-width="14" 
          stroke-linejoin="round" />

    <!-- Dynamic Manga Panel Borders (Koma) Spanning Across the Spine -->
    <!-- Top-Left & Top-Right Panel Cut -->
    <polygon points="128,142 234,158 234,218 128,236" fill="#08080a" />
    <polygon points="278,158 384,142 384,196 278,212" fill="#08080a" />

    <!-- The "Mihiraki" Bridge: A Single Wide Landscape Slash Breaking Across Both Pages -->
    <polygon points="92,258 420,210 420,286 92,334" fill="#08080a" stroke="#f5f2eb" stroke-width="10" stroke-linejoin="round" />
    <polygon points="102,266 410,220 410,276 102,322" fill="#d93829" />

    <!-- Speed-Line / Ink Katana Accent Inside the Center Spread Slash -->
    <polygon points="130,288 388,240 350,264" fill="#f5f2eb" />

    <!-- Bottom Panel Blocks -->
    <polygon points="128,342 234,326 234,362 128,346" fill="#08080a" />
    <polygon points="278,318 384,302 384,344 278,362" fill="#08080a" />
  </g>
</svg>
